apiVersion: v1
kind: Service
metadata:
  name: portfolio
  labels:
    app.kubernetes.io/name: portfolio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: portfolio
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portfolio
  labels:
    app.kubernetes.io/name: portfolio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portfolio
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Don't flap on a traffic spike that lasts thirty seconds.
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portfolio
  labels:
    app.kubernetes.io/name: portfolio
spec:
  # maxUnavailable, not minAvailable: with maxReplicas 6, `minAvailable: 1`
  # would let a drain evict 5 of 6 pods at once.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio
