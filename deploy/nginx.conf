# Server block for the built SPA.
#
# Mounted at /etc/nginx/conf.d/default.conf inside nginxinc/nginx-unprivileged,
# which runs as uid 101 and therefore cannot bind ports below 1024 — hence 8080.
#
# NOTE ON add_header: nginx only inherits add_header from an enclosing block if
# the current block declares NONE of its own. Any location that sets
# Cache-Control therefore has to re-include the security headers, or it serves
# none of them. That is why security-headers.conf is included repeatedly below
# rather than once at server level.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version.
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    # --- Compression ------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json font/woff2;

    # --- Caching ----------------------------------------------------------
    # Vite emits content-hashed filenames, so assets are safe to pin forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # The résumé should refresh when it is replaced.
    location = /Tamilarasan_CV.pdf {
        include /etc/nginx/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, must-revalidate" always;
    }

    # index.html must never be cached, or deploys go unnoticed.
    # This block is what `try_files ... /index.html` internally redirects to,
    # so it serves every navigation — missing headers here would mean the whole
    # site ships without a CSP.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # --- Health probe -----------------------------------------------------
    # Kubernetes probes hit this; keep it out of the access log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- SPA fallback -----------------------------------------------------
    # Any unknown path returns index.html so client-side routing keeps working.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Block dotfiles that should never have been in the image anyway.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Serve the SPA shell for unknown paths, but with a 200 rather than a 404 —
    # a bare `error_page 404 /index.html` returns HTML under a 404 status.
    error_page 404 =200 /index.html;
}
