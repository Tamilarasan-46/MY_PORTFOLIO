# Security headers, kept in one file because nginx's add_header does NOT
# inherit into a location that declares any add_header of its own — it replaces
# the whole inherited set. So every location that sets Cache-Control must
# `include` this file too, or it silently serves no security headers at all.

add_header X-Content-Type-Options  "nosniff"                                  always;
add_header X-Frame-Options         "SAMEORIGIN"                               always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"          always;
add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

# Google Fonts is the only external origin the page needs.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https://api.web3forms.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
